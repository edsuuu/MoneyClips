name: Auto Merge

on:
  workflow_run:
    workflows:
      - tests
      - tiktok-uploader (CI)
      - download-shorts (CI)
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only when every check for this commit is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # ponytail: assume que todos os runs deste commit ja existem quando o
          # primeiro conclui (o GitHub cria juntos no sync do PR). Janela de corrida
          # de segundos; se virar problema, dar um sleep/poll antes de checar.
          # todos os workflow runs deste commit (menos o proprio Auto Merge)
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request" \
            --paginate \
            --jq '.workflow_runs[] | select(.name != "Auto Merge") | [.status, .conclusion] | @tsv')

          [ -z "$runs" ] && { echo "sem runs para $SHA"; exit 0; }

          # ainda rodando? sai; a proxima conclusao re-dispara este workflow
          if echo "$runs" | grep -qv '^completed'; then
            echo "checks ainda rodando para $SHA"; exit 0
          fi
          # concluidos: qualquer conclusao que nao seja sucesso/skip/neutral barra o merge
          bad=$(echo "$runs" | awk -F'\t' '$2!="success" && $2!="skipped" && $2!="neutral"')
          if [ -n "$bad" ]; then
            echo "checks nao verdes para $SHA:"; echo "$bad"; exit 0
          fi

          pr=$(gh pr list --repo "$REPO" --search "$SHA" --state open --draft=false --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "nenhum PR aberto (nao-draft) para $SHA"; exit 0; }

          # REST em vez de `gh pr merge`: a mutation GraphQL do gh devolve
          # "Resource not accessible by integration" (403) com o GITHUB_TOKEN
          # em repo privado, mesmo com contents/pull-requests: write.
          # Ressalva documentada: PR que altera .github/workflows/ nao pode
          # ser mergeado pelo GITHUB_TOKEN (exige escopo `workflows`) — esses
          # continuam pedindo merge manual.
          gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash
