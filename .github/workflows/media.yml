name: media (CI)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'MicroServices/Media/**'
      - '.github/workflows/media.yml'

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MicroServices/Media
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.15.*

      - name: ruff check
        run: ruff check app --output-format=github

      - name: ruff format --check
        run: ruff format --check --diff app

  mypy:
    name: mypy (strict types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MicroServices/Media
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MicroServices/Media/requirements.txt

      - name: Install runtime + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.19.*

      - name: mypy --strict
        run: mypy app

  compile:
    name: compileall
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MicroServices/Media
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: compileall
        run: python -m compileall -q app
