name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json') }}
          restore-keys: node-

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Sem .env.example no repositorio: a suite so precisa de uma APP_KEY
      # (o phpunit.xml cobre o resto — banco, cache, fila, sessao, mailer).
      - name: Generate Application Key
        run: |
          echo "APP_KEY=" > .env
          php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Quality Checks and Tests
        run: composer check
