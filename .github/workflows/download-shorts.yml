name: download-shorts (CI)

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'MicroServices/download-shorts/**'
      - '.github/workflows/download-shorts.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'MicroServices/download-shorts/**'
      - '.github/workflows/download-shorts.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis (ruff + mypy + compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MicroServices/download-shorts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MicroServices/download-shorts/requirements.txt

      - name: Install runtime + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.7.* mypy==1.13.*

      - name: ruff check
        run: ruff check app

      - name: ruff format --check
        run: ruff format --check app

      - name: mypy
        run: mypy app

      - name: compileall
        run: python -m compileall -q app
