<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:oklch(0.222 0.02 260); border:1px solid oklch(0.29 0.02 260); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; height:100%;" style-hover="border-color:oklch(0.36 0.02 260);">

  <div style="display:flex; gap:12px;">
    <!-- Thumbnail placeholder -->
    <div style="width:56px; height:74px; border-radius:8px; background: repeating-linear-gradient(135deg, oklch(0.3 0.02 260) 0px, oklch(0.3 0.02 260) 4px, oklch(0.27 0.02 260) 4px, oklch(0.27 0.02 260) 8px); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.02 260)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7-11-7z" fill="oklch(0.55 0.02 260)" stroke="none"/></svg>
    </div>

    <div style="min-width:0; flex:1;">
      <div style="font-size:14px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">{{ video.title }}</div>
      <div class="mono" style="font-size:11px; color:oklch(0.5 0.02 260); margin-top:5px;">{{ video.id }}</div>
    </div>
  </div>

  <sc-if value="{{ video.hasTags }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; flex-wrap:wrap; gap:6px;">
      <sc-for list="{{ video.tags }}" as="tag" hint-placeholder-count="2">
        <div class="mono" style="font-size:11px; color:oklch(0.68 0.1 230); background:oklch(0.72 0.13 230 / 0.12); padding:3px 9px; border-radius:20px;">{{ tag }}</div>
      </sc-for>
    </div>
  </sc-if>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:10px; border-top:1px solid oklch(0.28 0.02 260);">
    <div class="mono" style="font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; background: {{ video.statusBg }}; color: {{ video.statusColor }}; width:fit-content;">{{ video.statusLabel }}</div>

    <button onClick="{{ openModal }}" style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; background:transparent; border:none; color:oklch(0.72 0.13 230); cursor:pointer; padding:0;" style-hover="color:oklch(0.8 0.13 230);">
      Visualizar
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
    </button>
  </div>

  <sc-if value="{{ video.showAddToQueue }}" hint-placeholder-val="{{ false }}">
    <button style="display:flex; align-items:center; justify-content:center; gap:7px; background:oklch(0.72 0.13 230); color:oklch(0.16 0.02 260); border:none; padding:9px 14px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer;" style-hover="background:oklch(0.78 0.13 230);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar à fila
    </button>
  </sc-if>

  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:oklch(0.1 0.02 260 / 0.65); display:flex; align-items:center; justify-content:center; z-index:60;" onClick="{{ closeModal }}">
      <div style="width:420px; max-height:88vh; background:oklch(0.2 0.02 260); border:1px solid oklch(0.3 0.02 260); border-radius:16px; overflow:hidden; display:flex; flex-direction:column;" onClick="{{ stopClick }}">

        <div style="width:100%; aspect-ratio:9/16; max-height:220px; background: repeating-linear-gradient(135deg, oklch(0.3 0.02 260) 0px, oklch(0.3 0.02 260) 6px, oklch(0.27 0.02 260) 6px, oklch(0.27 0.02 260) 12px); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.02 260)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5z" fill="oklch(0.6 0.02 260)" stroke="none"/></svg>
        </div>

        <div style="padding:18px 20px; display:flex; flex-direction:column; gap:14px; overflow-y:auto;">
          <div>
            <div class="mono" style="font-size:10.5px; letter-spacing:0.08em; color:oklch(0.55 0.02 260); margin-bottom:6px;">TÍTULO</div>
            <input value="{{ modalTitle }}" onChange="{{ onTitleChange }}" style="width:100%; background:oklch(0.16 0.02 260); border:1px solid oklch(0.32 0.02 260); border-radius:9px; padding:9px 11px; color:oklch(0.92 0.01 260); font-size:14px; font-weight:600; outline:none;"/>
          </div>
          <div>
            <div class="mono" style="font-size:10.5px; letter-spacing:0.08em; color:oklch(0.55 0.02 260); margin-bottom:6px;">LEGENDA / HASHTAGS</div>
            <input value="{{ modalTags }}" onChange="{{ onTagsChange }}" placeholder="#shorts #podcast" style="width:100%; background:oklch(0.16 0.02 260); border:1px solid oklch(0.32 0.02 260); border-radius:9px; padding:9px 11px; color:oklch(0.68 0.1 230); font-size:13px; outline:none;" class="mono"/>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
            <button onClick="{{ closeModal }}" style="background:transparent; border:1px solid oklch(0.34 0.02 260); color:oklch(0.75 0.02 260); padding:9px 16px; border-radius:9px; font-weight:600; font-size:13px; cursor:pointer;" style-hover="border-color:oklch(0.42 0.02 260); color:oklch(0.9 0.02 260);">Fechar</button>
            <button onClick="{{ saveEdits }}" style="background:oklch(0.72 0.13 230); border:none; color:oklch(0.16 0.02 260); padding:9px 16px; border-radius:9px; font-weight:700; font-size:13px; cursor:pointer;" style-hover="background:oklch(0.78 0.13 230);">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { modalOpen: false, editTitle: null, editTags: null };

  renderVals() {
    const video = this.props.video || {};
    const title = this.state.editTitle !== null ? this.state.editTitle : video.title;
    const tags = this.state.editTags !== null ? this.state.editTags : (video.tags || []).join(' ');

    return {
      video,
      modalOpen: this.state.modalOpen,
      modalTitle: title,
      modalTags: tags,
      openModal: () => this.setState({ modalOpen: true }),
      closeModal: () => this.setState({ modalOpen: false }),
      stopClick: (e) => e.stopPropagation(),
      onTitleChange: (e) => this.setState({ editTitle: e.target.value }),
      onTagsChange: (e) => this.setState({ editTags: e.target.value }),
      saveEdits: () => this.setState({ modalOpen: false }),
    };
  }
}

</script>
</body>
</html>
