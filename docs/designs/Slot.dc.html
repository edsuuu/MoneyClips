<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-radius:11px; padding:10px 11px; display:flex; flex-direction:column; gap:7px; border: {{ borderStyle }}; background: {{ bgStyle }}; opacity: {{ opacityStyle }};" style-hover="filter:brightness(1.08);">

  <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
    <div style="display:flex; align-items:center; gap:7px;">
      <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
        <div class="mono" style="font-size:13px; font-weight:700; color: {{ timeColor }};">{{ slot.time }}</div>
      </sc-if>
      <sc-if value="{{ editable }}" hint-placeholder-val="{{ true }}">
        <div class="mono" contentEditable="true" onBlur="{{ slot.commitTime }}" onKeyDown="{{ slot.timeKeyDown }}" title="Clique para editar o horário" style="font-size:13px; font-weight:700; color: {{ timeColor }}; outline:none; min-width:20px; cursor:text;">{{ slot.time }}</div>
      </sc-if>
      <div style="width:6px; height:6px; border-radius:50%; background: {{ dotColor }}; border: {{ dotBorder }}; flex-shrink:0;"></div>
    </div>

    <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
      <div title="Já publicado — bloqueado" style="display:flex; align-items:center; gap:4px; color:oklch(0.6 0.06 150); flex-shrink:0;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
    </sc-if>
    <sc-if value="{{ editable }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:4px;">
        <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ slot.openPicker }}" title="Editar horário/vídeo" style="width:18px; height:18px; border-radius:5px; border:none; background:transparent; color:oklch(0.55 0.02 260); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;" style-hover="background:oklch(0.28 0.06 230 / 0.4); color:oklch(0.72 0.13 230);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          </button>
        </sc-if>
        <button onClick="{{ slot.toggle }}" title="Ativar/desativar horário" style="width:28px; height:16px; border-radius:9px; border:none; cursor:pointer; position:relative; background: {{ trackColor }}; padding:0; flex-shrink:0;">
          <div style="width:12px; height:12px; border-radius:50%; background:white; position:absolute; top:2px; left: {{ knobPos }}; transition: left 0.12s;"></div>
        </button>
        <button onClick="{{ slot.remove }}" title="Remover horário" style="width:18px; height:18px; border-radius:5px; border:none; background:transparent; color:oklch(0.5 0.02 260); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;" style-hover="background:oklch(0.32 0.1 25 / 0.3); color:oklch(0.8 0.14 25);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:11.5px; line-height:1.3; color:oklch(0.8 0.02 260); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">{{ slot.title }}</div>
  </sc-if>
  <sc-if value="{{ emptyActive }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ slot.openPicker }}" style="display:flex; align-items:center; justify-content:center; gap:6px; background:transparent; border:1px dashed oklch(0.4 0.02 260); color:oklch(0.62 0.02 260); border-radius:7px; padding:6px 8px; font-size:11.5px; font-weight:600; cursor:pointer; width:100%;" style-hover="border-color:oklch(0.72 0.13 230); color:oklch(0.72 0.13 230);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Buscar vídeo
    </button>
  </sc-if>
  <sc-if value="{{ emptyInactive }}" hint-placeholder-val="{{ false }}">
    <div title="Ative o horário para agendar um vídeo" style="display:flex; align-items:center; justify-content:center; gap:6px; border:1px dashed oklch(0.3 0.02 260); color:oklch(0.42 0.02 260); border-radius:7px; padding:6px 8px; font-size:11px; font-weight:600; width:100%; cursor:not-allowed;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Postagem desativada
    </div>
  </sc-if>
  <sc-if value="{{ isNext }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:10px; font-weight:700; letter-spacing:0.05em; color:oklch(0.18 0.05 150); background:oklch(0.72 0.16 150); padding:3px 8px; border-radius:6px; width:fit-content;">PRÓXIMO</div>
  </sc-if>
  <sc-if value="{{ isSkipped }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="font-size:10px; font-weight:700; letter-spacing:0.03em; color:oklch(0.18 0.05 85); background:oklch(0.8 0.15 85); padding:3px 8px; border-radius:6px; width:fit-content;">PULADO</div>
      <sc-if value="{{ canForce }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ slot.force }}" style="display:flex; align-items:center; justify-content:center; gap:6px; background:oklch(0.8 0.15 85); color:oklch(0.2 0.05 85); border:none; padding:7px 10px; border-radius:8px; font-weight:700; font-size:11.5px; cursor:pointer; width:100%;" style-hover="filter:brightness(1.08);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
          Forçar agora
        </button>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ isFailed }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="font-size:10px; font-weight:700; letter-spacing:0.03em; color: {{ failBadgeColor }}; background: {{ failBadgeBg }}; padding:3px 8px; border-radius:6px; width:fit-content;">{{ failBadgeText }}</div>
        <button onClick="{{ toggleReason }}" style="background:transparent; border:none; color:oklch(0.72 0.16 25); font-size:11px; font-weight:600; cursor:pointer; padding:0; text-decoration:underline;">Ver motivo</button>
      </div>
      <sc-if value="{{ showReason }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:7px; background:oklch(0.2 0.02 260); border:1px solid oklch(0.32 0.02 260); border-radius:8px; padding:9px 10px;">
          <sc-for list="{{ platformResults }}" as="pr" hint-placeholder-count="3">
            <div style="display:flex; flex-direction:column; gap:3px;">
              <div style="display:flex; align-items:center; gap:7px;">
                <sc-if value="{{ pr.ok }}" hint-placeholder-val="{{ true }}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.16 150)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 6L9 17l-5-5"/></svg>
                </sc-if>
                <sc-if value="{{ pr.failed }}" hint-placeholder-val="{{ false }}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.19 25)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                </sc-if>
                <span style="font-size:11px; font-weight:700; color:oklch(0.85 0.02 260);">{{ pr.name }}</span>
                <span style="font-size:10px; font-weight:600; color: {{ pr.labelColor }}; margin-left:auto;">{{ pr.label }}</span>
              </div>
              <sc-if value="{{ pr.hasReason }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:10px; line-height:1.4; color:oklch(0.78 0.08 25); padding-left:20px;">{{ pr.reason }}</div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ isPosted }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:10px; font-weight:600; letter-spacing:0.03em; color:oklch(0.55 0.04 150);">Publicado</div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { showReason: false };
  renderVals() {
    const slot = this.props.slot || {};
    const status = slot.status || 'empty';
    const active = slot.active !== false;
    const locked = status === 'posted' || status === 'failed' || slot.readonly === true;
    const map = {
      empty: {
        border: '1.5px dashed oklch(0.34 0.02 260)',
        bg: 'transparent',
        timeColor: 'oklch(0.55 0.02 260)',
        dot: 'transparent',
        dotBorder: '1.5px solid oklch(0.4 0.02 260)',
      },
      posted: {
        border: '1px solid oklch(0.3 0.02 260)',
        bg: 'oklch(0.185 0.015 260)',
        timeColor: 'oklch(0.6 0.02 260)',
        dot: 'oklch(0.6 0.1 150)',
        dotBorder: 'none',
      },
      failed: {
        border: '1px solid oklch(0.45 0.15 25 / 0.5)',
        bg: 'oklch(0.24 0.06 25 / 0.22)',
        timeColor: 'oklch(0.78 0.16 25)',
        dot: 'oklch(0.65 0.2 25)',
        dotBorder: 'none',
      },
      due: {
        border: '1px solid oklch(0.4 0.02 260)',
        bg: 'oklch(0.24 0.02 260)',
        timeColor: 'oklch(0.75 0.02 260)',
        dot: 'oklch(0.5 0.02 260)',
        dotBorder: 'none',
      },
      next: {
        border: '1.5px solid oklch(0.6 0.16 150 / 0.6)',
        bg: 'oklch(0.28 0.06 150 / 0.25)',
        timeColor: 'oklch(0.85 0.12 150)',
        dot: 'oklch(0.75 0.16 150)',
        dotBorder: 'none',
      },
      skipped: {
        border: '1.5px solid oklch(0.7 0.14 85 / 0.55)',
        bg: 'oklch(0.3 0.07 85 / 0.2)',
        timeColor: 'oklch(0.85 0.13 85)',
        dot: 'oklch(0.8 0.15 85)',
        dotBorder: 'none',
      },
    };
    const cfg = map[status] || map.empty;
    const rawPlatforms = (slot.platforms && slot.platforms.length)
      ? slot.platforms
      : [{ name: 'YouTube', ok: false, reason: slot.reason || 'Falha ao enviar para a plataforma. Verifique a conexão da conta e tente novamente.' }];
    const platformResults = rawPlatforms.map(p => ({
      name: p.name,
      ok: !!p.ok,
      failed: !p.ok,
      label: p.ok ? 'Publicado' : 'Falhou',
      labelColor: p.ok ? 'oklch(0.72 0.14 150)' : 'oklch(0.72 0.16 25)',
      reason: p.reason || '',
      hasReason: !p.ok && !!p.reason,
    }));
    const isPartial = rawPlatforms.some(p => p.ok) && rawPlatforms.some(p => !p.ok);
    return {
      slot,
      hasTitle: !!slot.title,
      hasEmptyLabel: !slot.title && status === 'empty',
      isNext: status === 'next',
      isSkipped: status === 'skipped',
      canForce: status === 'skipped' && slot.readonly !== true,
      isFailed: status === 'failed',
      isPosted: status === 'posted',
      platformResults,
      failBadgeText: isPartial ? 'PARCIAL' : 'NÃO POSTADO',
      failBadgeBg: isPartial ? 'oklch(0.8 0.15 85)' : 'oklch(0.55 0.2 25)',
      failBadgeColor: isPartial ? 'oklch(0.2 0.05 85)' : 'oklch(0.98 0.02 25)',
      showReason: this.state.showReason,
      toggleReason: () => this.setState(s => ({ showReason: !s.showReason })),
      emptyActive: !slot.title && status === 'empty' && active,
      emptyInactive: !slot.title && status === 'empty' && !active,
      locked,
      lockedLabel: status === 'failed' ? 'Não postado' : 'Publicado',
      lockedColor: status === 'failed' ? 'oklch(0.72 0.18 25)' : 'oklch(0.55 0.04 150)',
      editable: !locked,
      borderStyle: cfg.border,
      bgStyle: cfg.bg,
      timeColor: cfg.timeColor,
      dotColor: cfg.dot,
      dotBorder: cfg.dotBorder,
      opacityStyle: locked ? '0.6' : (active ? '1' : '0.45'),
      trackColor: active ? 'oklch(0.55 0.14 150)' : 'oklch(0.32 0.02 260)',
      knobPos: active ? '15px' : '2px',
    };
  }
}

</script>
</body>
</html>
