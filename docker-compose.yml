# O Laravel roda NATIVO (php artisan serve em dev / nginx + php-fpm em prod),
# fora do Docker. Este compose sobe só os microserviços. Os containers chamam
# de volta o Laravel nativo via host.docker.internal (extra_hosts abaixo).
services:
  download-shorts:
    build:
      context: ./MicroServices/DownloadShorts
      target: runtime
    image: download-shorts
    restart: unless-stopped
    ports:
      - "8770:8770"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8770"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

      # Endpoint literal: dentro do container, host.docker.internal = MinIO no host.
      # NÃO interpolar de AWS_ENDPOINT (no .env ele é 127.0.0.1 pro Laravel nativo).
      STORAGE_ENDPOINT: "http://host.docker.internal:9000"
      STORAGE_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      STORAGE_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      STORAGE_BUCKET: "${AWS_BUCKET:-video}"
      STORAGE_SECURE: "false"
      STORAGE_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      STORAGE_USE_PATH_STYLE: "${AWS_USE_PATH_STYLE_ENDPOINT:-true}"
      STORAGE_PATH_PREFIX: "shorts"

      TEMP_DIR: "${TEMP_DIR:-/tmp/download-shorts}"
      DOWNLOAD_WORKERS: "${DOWNLOAD_WORKERS:-4}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-3}"
      WEBHOOK_TIMEOUT_SECONDS: "${WEBHOOK_TIMEOUT_SECONDS:-30}"
      WEBHOOK_RETRY_DELAYS_SECONDS: "${WEBHOOK_RETRY_DELAYS_SECONDS:-[1.0,5.0,15.0]}"
      GPU_ENCODER: "${GPU_ENCODER:-none}"
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tiktok-uploader:
    build:
      context: ./MicroServices/TikTokUploader
    image: tiktok-uploader
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      # Endpoint literal (host.docker.internal = MinIO no host); ver nota em download-shorts.
      AWS_ENDPOINT: "http://host.docker.internal:9000"
      AWS_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-video}"
      S3_PREFIX: "${S3_PREFIX:-shorts/}"
      TIKTOK_ACCOUNT_NAME: "${TIKTOK_ACCOUNT_NAME:-}"
      TIKTOK_ACCOUNT_EMAIL: "${TIKTOK_ACCOUNT_EMAIL:-}"
      TIKTOK_ACCOUNT_PASSWORD: "${TIKTOK_ACCOUNT_PASSWORD:-}"
      ROBOFLOW_API_KEY: "${ROBOFLOW_API_KEY:-}"
      S3_DOWNLOAD_RETRIES: "${S3_DOWNLOAD_RETRIES:-3}"
      S3_DOWNLOAD_RETRY_DELAY_MS: "${S3_DOWNLOAD_RETRY_DELAY_MS:-2000}"
      HEADLESS: "${HEADLESS:-true}"
      DRY_RUN: "${DRY_RUN:-true}"
      TZ: "America/Sao_Paulo"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      API_PORT: "8090"
      API_TOKEN: "${TIKTOK_POST_API_TOKEN:-}"
    volumes:
      # Sessão do TikTok gerada fora do container (login local com HEADLESS=false).
      - ./MicroServices/TikTokUploader/cookies:/app/cookies
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  reencode:
    build:
      context: ./MicroServices/Reencode
    image: reencode
    restart: unless-stopped
    ports:
      - "8790:8790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      # Endpoint literal (host.docker.internal = MinIO no host); ver nota em download-shorts.
      AWS_ENDPOINT: "http://host.docker.internal:9000"
      AWS_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-video}"
      S3_PREFIX: "${S3_PREFIX:-shorts/}"
      S3_DOWNLOAD_RETRIES: "${S3_DOWNLOAD_RETRIES:-3}"
      S3_DOWNLOAD_RETRY_DELAY_MS: "${S3_DOWNLOAD_RETRY_DELAY_MS:-2000}"
      REENCODE_ENABLED: "${REENCODE_ENABLED:-true}"
      REENCODE_BITRATE_THRESHOLD_KBPS: "${REENCODE_BITRATE_THRESHOLD_KBPS:-4000}"
      TZ: "America/Sao_Paulo"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      API_PORT: "8790"
      API_TOKEN: "${REENCODE_API_TOKEN:-}"
    # NVENC (GPU NVIDIA) acelera o reencode. Requer nvidia-container-toolkit no
    # host — descomente o bloco abaixo APENAS nesse caso (senão `docker compose
    # up` falha com "could not select device driver"). Sem GPU o serviço cai
    # automaticamente para libx264 (CPU).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8790/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
