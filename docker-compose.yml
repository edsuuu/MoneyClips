services:
  download-shorts:
    build:
      context: ./MicroServices/download-shorts
      target: runtime
    image: gcl-download-shorts
    restart: unless-stopped
    ports:
      - "8770:8770"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8770"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-http://host.docker.internal:9000}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-minioadmin}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-minioadmin}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-video}"
      STORAGE_SECURE: "${STORAGE_SECURE:-false}"
      STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
      STORAGE_USE_PATH_STYLE: "${STORAGE_USE_PATH_STYLE:-true}"
      STORAGE_PATH_PREFIX: "${STORAGE_PATH_PREFIX:-shorts}"

      TEMP_DIR: "${TEMP_DIR:-/tmp/download-shorts}"
      DOWNLOAD_WORKERS: "${DOWNLOAD_WORKERS:-4}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-3}"
      WEBHOOK_TIMEOUT_SECONDS: "${WEBHOOK_TIMEOUT_SECONDS:-30}"
      WEBHOOK_RETRY_DELAYS_SECONDS: "${WEBHOOK_RETRY_DELAYS_SECONDS:-[1.0,5.0,15.0]}"
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tiktok-uploader:
    build:
      context: ./MicroServices/TikTokAutoUploader
    image: gcl-tiktok-uploader
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./MicroServices/TikTokAutoUploader/.env
    environment:
      # MinIO/S3 do host; o container é headless (sem display, sem QR Code).
      AWS_ENDPOINT: "http://host.docker.internal:9000"
      HEADLESS: "true"
      API_PORT: "8090"
    volumes:
      # Sessão do TikTok gerada fora do container (login local com HEADLESS=false).
      - ./MicroServices/TikTokAutoUploader/cookies:/app/cookies
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
