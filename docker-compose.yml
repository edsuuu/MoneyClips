services:
  laravel:
    image: sail-8.4/app
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:80"
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://host.docker.internal:9000}"
      DOWNLOAD_YOUTUBE_URL: "http://download-shorts:8770"
      TIKTOK_UPLOADER_URL: "http://tiktok-uploader:8090"
      TIKTOK_POST_URL: "http://tiktok-uploader:8090"
      DOWNLOAD_YOUTUBE_WEBHOOK_URL: "http://laravel/api/download-youtube/webhook"
      TIKTOK_POST_CALLBACK_URL: "http://laravel/api/tiktok-posts/callback"
    volumes:
      - '.:/var/www/html'
    depends_on:
      - download-shorts
      - tiktok-uploader

  download-shorts:
    build:
      context: ./MicroServices/DownloadShorts
      target: runtime
    image: gcl-download-shorts
    restart: unless-stopped
    ports:
      - "8770:8770"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8770"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-http://host.docker.internal:9000}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-minioadmin}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-minioadmin}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-video}"
      STORAGE_SECURE: "${STORAGE_SECURE:-false}"
      STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
      STORAGE_USE_PATH_STYLE: "${STORAGE_USE_PATH_STYLE:-true}"
      STORAGE_PATH_PREFIX: "${STORAGE_PATH_PREFIX:-shorts}"

      TEMP_DIR: "${TEMP_DIR:-/tmp/download-shorts}"
      DOWNLOAD_WORKERS: "${DOWNLOAD_WORKERS:-4}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-3}"
      WEBHOOK_TIMEOUT_SECONDS: "${WEBHOOK_TIMEOUT_SECONDS:-30}"
      WEBHOOK_RETRY_DELAYS_SECONDS: "${WEBHOOK_RETRY_DELAYS_SECONDS:-[1.0,5.0,15.0]}"
      GPU_ENCODER: "${GPU_ENCODER:-none}"
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tiktok-uploader:
    build:
      context: ./MicroServices/TikTokUploader
    image: gcl-tiktok-uploader
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-http://host.docker.internal:9000}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-video}"
      S3_PREFIX: "${S3_PREFIX:-shorts/}"
      TIKTOK_ACCOUNT_NAME: "${TIKTOK_ACCOUNT_NAME:-}"
      TIKTOK_ACCOUNT_EMAIL: "${TIKTOK_ACCOUNT_EMAIL:-}"
      TIKTOK_ACCOUNT_PASSWORD: "${TIKTOK_ACCOUNT_PASSWORD:-}"
      ROBOFLOW_API_KEY: "${ROBOFLOW_API_KEY:-}"
      HEADLESS: "true"
      STEALTH: "${STEALTH:-false}"
      DRY_RUN: "${DRY_RUN:-true}"
      TZ: "America/Sao_Paulo"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      API_PORT: "8090"
    volumes:
      - ./MicroServices/TikTokUploader/cookies:/app/cookies
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
