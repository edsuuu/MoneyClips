<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <title>TikTok Cookie Bridge</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b1220;
            color: #e2e8f0;
        }
        h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: 600; }
        label { display: block; margin-top: 8px; font-size: 11px; color: #94a3b8; }
        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 6px 8px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 6px;
            font-size: 12px;
        }
        button {
            margin-top: 12px;
            width: 100%;
            padding: 8px;
            background: #10b981;
            color: #022c22;
            border: 0;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        button:hover { background: #34d399; }
        #status { margin-top: 12px; font-size: 12px; min-height: 16px; }
        .ok { color: #34d399; }
        .err { color: #f87171; }
    </style>
</head>
<body>
    <h3>TikTok Cookie Bridge</h3>
    <label for="endpoint">Endpoint Laravel</label>
    <input id="endpoint" type="text" placeholder="http://127.0.0.1:8000/api/tiktok/cookies/ingest" />
    <label for="token">Token (TIKTOK_BRIDGE_TOKEN)</label>
    <input id="token" type="password" placeholder="cole o token do .env" />
    <button id="send">Ler cookies e enviar</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
