# docker-compose.yml — microserviço tiktok-uploader (porta 8090).
#
# As credenciais vêm do .env deste diretório (o compose substitui ${VAR}).
# Sem banco: o Laravel chama POST /posts e recebe o resultado no webhook_url.
#
# O S3 é o MinIO local: como o MinIO roda no host, o container o alcança por
# host.docker.internal (mapeado abaixo). Ajuste AWS_ENDPOINT no .env se preciso.
#
# Login do TikTok: container headless, sem QR Code. Gere os cookies fora (login
# local com HEADLESS=false) — a pasta cookies/ montada como volume os carrega.
#
# Subir:  docker compose up --build -d
# DRY_RUN segue o .env (default true). Só deixe false para publicar de verdade.

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # S3 (MinIO local no host)
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-http://host.docker.internal:9000}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-video}"
      S3_PREFIX: "${S3_PREFIX:-shorts/}"
      # TikTok
      TIKTOK_ACCOUNT_NAME: "${TIKTOK_ACCOUNT_NAME:?defina no .env}"
      TIKTOK_ACCOUNT_EMAIL: "${TIKTOK_ACCOUNT_EMAIL:-}"
      TIKTOK_ACCOUNT_PASSWORD: "${TIKTOK_ACCOUNT_PASSWORD:-}"
      ROBOFLOW_API_KEY: "${ROBOFLOW_API_KEY:-}"
      # Automação + API
      HEADLESS: "true"
      STEALTH: "${STEALTH:-false}"
      DRY_RUN: "${DRY_RUN:-true}"
      TZ: "America/Sao_Paulo"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      API_PORT: "8090"
    volumes:
      # Sessão do TikTok (gerada fora do container).
      - ./cookies:/app/cookies
