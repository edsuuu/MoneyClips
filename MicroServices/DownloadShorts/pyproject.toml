[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "TID",    # flake8-tidy-imports
    "PTH",    # flake8-use-pathlib
    "PERF",   # perflint
    "ASYNC",  # flake8-async
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "T20",    # flake8-print (no print statements)
    "TRY",    # tryceratops
    "S",      # flake8-bandit (security)
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # handled by the formatter
    "S101",   # assert allowed (defensive checks)
    "TRY003", # long error messages are fine
    "TRY300", # else-after-return é estilo, não bug
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
# FastAPI decorators são `Any` no nível de tipo — não dá pra checar sem stubs completos.
disallow_untyped_decorators = false
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
