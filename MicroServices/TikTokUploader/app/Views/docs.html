<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok Uploader · API</title>
    <style>
        :root {
            --bg: #0e0e10;
            --bg-2: #161618;
            --bg-3: #1e1e22;
            --border: #2a2a30;
            --text: #f5f5f7;
            --muted: #9a9aa5;
            --accent: #1db954;
            --get: #1db954;
            --post: #4a90e2;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5;
        }
        a { color: inherit; text-decoration: none; }

        .topbar {
            flex-shrink: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 12px 22px; background: var(--bg-2); border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
        .brand .dot { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; font-weight: 800; color: #000; }
        .brand b { font-size: 14px; display: block; }
        .brand small { color: var(--muted); font-size: 11px; }
        .base-input {
            flex: 1; min-width: 200px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 13px;
        }
        .btn {
            border: 1px solid var(--border); background: var(--bg-3); color: var(--text);
            border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent); }
        .btn.accent { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn.accent:hover { filter: brightness(1.08); }

        main { flex: 1; min-height: 0; padding: 16px 22px; }
        #endpoints {
            display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr);
            gap: 14px; height: 100%; min-height: 0;
        }

        .acc { border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; overflow: hidden; background: var(--bg-2); display: flex; flex-direction: column; min-height: 0; }
        .acc.get { border-left-color: var(--get); }
        .acc.post { border-left-color: var(--post); }
        .acc-head { flex-shrink: 0; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; cursor: pointer; text-align: left; color: var(--text); }
        .acc-head:hover { background: var(--bg-3); }
        .badge { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; color: #000; letter-spacing: .5px; flex-shrink: 0; }
        .badge.get { background: var(--get); } .badge.post { background: var(--post); }
        .acc-head .path { font-family: var(--mono); font-size: 14px; font-weight: 600; flex-shrink: 0; }
        .acc-head .summary { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .caret { color: var(--muted); transition: transform .18s ease; flex-shrink: 0; }
        .acc.open .caret { transform: rotate(180deg); }

        .acc-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 16px; border-top: 1px solid var(--border); }
        h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 16px 0 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
        td code { font-family: var(--mono); font-size: 12px; color: #ffd479; }
        .tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 20px; }
        .tag.req { color: var(--accent); background: rgba(29,185,84,.12); }
        .tag.opt { color: var(--muted); background: var(--bg-3); }

        pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 0; }
        pre code { font-family: var(--mono); font-size: 12px; color: #d7d7de; white-space: pre; }

        @media (max-width: 820px) {
            body { height: auto; overflow: auto; }
            main { min-height: 0; }
            #endpoints { grid-template-columns: 1fr; grid-auto-rows: auto; height: auto; }
            .acc-body { overflow: visible; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><div class="dot">t</div><div><b>TikTok Uploader</b><small>API · microserviço</small></div></div>
        <input id="base" class="base-input" spellcheck="false" />
        <button id="export-md" class="btn">.md</button>
        <button id="export-postman" class="btn">Postman</button>
        <button id="export-insomnia" class="btn">Insomnia</button>
    </div>

    <main>
        <div id="endpoints"></div>
    </main>

    <script>
        const ENDPOINTS = [
            {
                id: 'health', method: 'GET', path: '/health', send: 'none',
                desc: 'Verifica se o serviço está no ar e se o modo DRY_RUN está ativo.',
                params: [], response: { status: 'ok', dry_run: true },
            },
            {
                id: 'login', method: 'POST', path: '/login', send: 'json',
                desc: 'Login no TikTok; devolve os cookies da sessão no JSON. Modos: email/senha ou QR Code.',
                params: [
                    { name: 'email', type: 'string', required: false, control: 'text', placeholder: 'a@b.com', desc: 'Obrigatório se qr_code não for enviado.' },
                    { name: 'password', type: 'string', required: false, control: 'password', placeholder: 'senha', desc: 'Obrigatório se qr_code não for enviado.' },
                    { name: 'qr_code', type: 'boolean', required: false, control: 'checkbox', desc: 'Abre o navegador no QR e ignora email/senha.' },
                    { name: 'keep_open', type: 'boolean', required: false, control: 'checkbox', desc: 'Mantém o navegador aberto (mesmo em erro).' },
                ],
                sample: { email: 'a@b.com', password: 'secret' },
                response: { account: '@sua_conta', cookies: ['…cookies do Playwright…'], expired: false, valid: true },
            },
            {
                id: 'session', method: 'POST', path: '/session', send: 'json',
                desc: 'Valida cookies: injeta no navegador, abre o TikTok e lê o @handle da conta logada.',
                params: [
                    { name: 'cookies', type: 'array', required: true, control: 'textarea', json: true, placeholder: '[ { "name": "sessionid", "value": "…", "domain": ".tiktok.com", "path": "/" } ]', desc: 'Array não-vazio de cookies do TikTok.' },
                ],
                sample: { cookies: [{ name: 'sessionid', value: '…', domain: '.tiktok.com', path: '/' }] },
                response: { account: '@sua_conta', has_cookies: true, expired: false, valid: true },
            },
            {
                id: 'posts', method: 'POST', path: '/posts', send: 'multipart',
                desc: 'Publica um vídeo. O binário vem direto na requisição (multipart/form-data).',
                params: [
                    { name: 'video', type: 'file', required: true, control: 'file', desc: 'Arquivo do vídeo (binário).' },
                    { name: 'cookies', type: 'string(JSON)', required: true, control: 'textarea', placeholder: '[ { … } ]', desc: 'Array de cookies da sessão, serializado.' },
                    { name: 'title', type: 'string', required: false, control: 'text', placeholder: 'minha legenda', desc: 'Descrição/legenda do post.' },
                    { name: 'hashtags', type: 'string', required: false, control: 'text', placeholder: '["fyp","clips"]', desc: 'JSON array ou lista separada por vírgula.' },
                ],
                response: { status: 'completed', title: 'meu vídeo' },
            },
        ];

        const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const parts = (ep) => ep.path.split('/').filter(Boolean);
        const baseInput = document.getElementById('base');
        baseInput.value = window.location.origin;

        function reqTag(p) {
            return p.required ? '<span class="tag req">obrigatório</span>' : '<span class="tag opt">opcional</span>';
        }
        function paramsTable(ep) {
            if (!ep.params.length) return '';
            const rows = ep.params.map((p) => `<tr><td><code>${p.name}</code></td><td>${p.type}</td><td>${reqTag(p)}</td><td>${esc(p.desc || '')}</td></tr>`).join('');
            return `<h4>Parâmetros</h4><table><tr><th>Campo</th><th>Tipo</th><th></th><th>Descrição</th></tr>${rows}</table>`;
        }

        function renderEndpoint(ep) {
            const m = ep.method.toLowerCase();
            const node = el(`
                <div class="acc ${m} open" id="${ep.id}">
                    <button class="acc-head" aria-expanded="true">
                        <span class="badge ${m}">${ep.method}</span>
                        <span class="path">${ep.path}</span>
                        <span class="summary">${esc(ep.desc)}</span>
                        <span class="caret">▾</span>
                    </button>
                    <div class="acc-body">
                        ${paramsTable(ep)}
                        <h4>Resposta 200</h4>
                        <pre><code>${esc(JSON.stringify(ep.response, null, 2))}</code></pre>
                    </div>
                </div>
            `);
            const head = node.querySelector('.acc-head');
            const body = node.querySelector('.acc-body');
            head.addEventListener('click', () => {
                const open = body.hidden;
                body.hidden = !open;
                head.setAttribute('aria-expanded', String(open));
                node.classList.toggle('open', open);
            });
            return node;
        }

        function download(name, content, type) {
            const blob = new Blob([content], { type });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function toMarkdown() {
            let md = `# TikTok Uploader — API\n\nBase URL: \`${baseInput.value}\`\n\n`;
            ENDPOINTS.forEach((ep) => {
                md += `## ${ep.method} ${ep.path}\n\n${ep.desc}\n\n`;
                if (ep.params.length) {
                    md += `| Campo | Tipo | Obrigatório | Descrição |\n|---|---|---|---|\n`;
                    ep.params.forEach((p) => { md += `| \`${p.name}\` | ${p.type} | ${p.required ? 'sim' : 'não'} | ${(p.desc || '').replace(/\|/g, '\\|')} |\n`; });
                    md += `\n`;
                }
                md += `**Resposta 200**\n\n\`\`\`json\n${JSON.stringify(ep.response, null, 2)}\n\`\`\`\n\n`;
            });
            return md;
        }

        function toPostman() {
            return {
                info: { name: 'TikTok Uploader API', schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json' },
                variable: [{ key: 'baseUrl', value: baseInput.value }],
                item: ENDPOINTS.map((ep) => {
                    const req = { method: ep.method, header: [], url: { raw: '{{baseUrl}}' + ep.path, host: ['{{baseUrl}}'], path: parts(ep) } };
                    if (ep.send === 'json' && ep.sample) {
                        req.header.push({ key: 'Content-Type', value: 'application/json' });
                        req.body = { mode: 'raw', raw: JSON.stringify(ep.sample, null, 2), options: { raw: { language: 'json' } } };
                    } else if (ep.send === 'multipart') {
                        req.body = { mode: 'formdata', formdata: ep.params.map((p) => p.control === 'file' ? { key: p.name, type: 'file', src: '' } : { key: p.name, type: 'text', value: p.placeholder || '' }) };
                    }
                    return { name: `${ep.method} ${ep.path}`, request: req };
                }),
            };
        }

        function toInsomnia() {
            const wrk = 'wrk_ttu';
            const resources = [
                { _id: wrk, _type: 'workspace', name: 'TikTok Uploader' },
                { _id: 'env_base', _type: 'environment', parentId: wrk, name: 'Base', data: { base_url: baseInput.value } },
            ];
            ENDPOINTS.forEach((ep) => {
                const r = { _id: 'req_' + ep.id, _type: 'request', parentId: wrk, name: `${ep.method} ${ep.path}`, method: ep.method, url: '{{ _.base_url }}' + ep.path, headers: [], body: {} };
                if (ep.send === 'json' && ep.sample) {
                    r.headers = [{ name: 'Content-Type', value: 'application/json' }];
                    r.body = { mimeType: 'application/json', text: JSON.stringify(ep.sample, null, 2) };
                } else if (ep.send === 'multipart') {
                    r.body = { mimeType: 'multipart/form-data', params: ep.params.map((p) => p.control === 'file' ? { name: p.name, type: 'file', fileName: '' } : { name: p.name, value: p.placeholder || '' }) };
                }
                resources.push(r);
            });
            return { _type: 'export', __export_format: 4, __export_source: 'tiktok-uploader', resources };
        }

        const container = document.getElementById('endpoints');
        ENDPOINTS.forEach((ep) => container.appendChild(renderEndpoint(ep)));

        document.getElementById('export-md').addEventListener('click', () => download('tiktok-uploader-api.md', toMarkdown(), 'text/markdown'));
        document.getElementById('export-postman').addEventListener('click', () => download('tiktok-uploader.postman_collection.json', JSON.stringify(toPostman(), null, 2), 'application/json'));
        document.getElementById('export-insomnia').addEventListener('click', () => download('tiktok-uploader.insomnia.json', JSON.stringify(toInsomnia(), null, 2), 'application/json'));
    </script>
</body>
</html>
