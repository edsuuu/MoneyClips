services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    network_mode: host
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8770"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-https://usc1.contabostorage.com}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY no .env}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY no .env}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-videos}"
      STORAGE_SECURE: "${STORAGE_SECURE:-true}"
      STORAGE_REGION: "${STORAGE_REGION:-usc1}"
      STORAGE_USE_PATH_STYLE: "${STORAGE_USE_PATH_STYLE:-true}"
      STORAGE_PATH_PREFIX: "${STORAGE_PATH_PREFIX:-shorts}"

      TEMP_DIR: "/tmp/download-shorts"
      DOWNLOAD_WORKERS: "${DOWNLOAD_WORKERS:-4}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-3}"
      WEBHOOK_TIMEOUT_SECONDS: "${WEBHOOK_TIMEOUT_SECONDS:-30}"
    command: ["python", "-m", "app.main"]
